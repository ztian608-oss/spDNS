name: Legacy-numeric-regression

on:
  pull_request:
  push:
    branches: [refactor/spdns-core]

permissions:
  contents: read

jobs:
  compare-legacy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LEGACY_LIB: /tmp/spdns-legacy-lib
      REGRESSION_DIR: /tmp/spdns-regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Prepare isolated legacy source and libraries
        run: |
          mkdir -p "$LEGACY_LIB" "$REGRESSION_DIR" /tmp/spdns-legacy
          git archive origin/legacy-spDNS-before-core-refactor | tar -x -C /tmp/spdns-legacy
          R CMD INSTALL --library="$LEGACY_LIB" /tmp/spdns-legacy
          R CMD INSTALL .
      - name: Generate fixed synthetic input
        run: Rscript tests/regression/generate-input.R "$REGRESSION_DIR/input.rds"
      - name: Run legacy scDNS
        run: Rscript tests/regression/run-version.R legacy "$REGRESSION_DIR/input.rds" "$REGRESSION_DIR/legacy.rds" "$LEGACY_LIB"
      - name: Run refactored spDNS
        run: Rscript tests/regression/run-version.R current "$REGRESSION_DIR/input.rds" "$REGRESSION_DIR/current.rds"
      - name: Compare core slots at tolerance 1e-8
        run: Rscript tests/regression/compare-results.R "$REGRESSION_DIR/legacy.rds" "$REGRESSION_DIR/current.rds"
